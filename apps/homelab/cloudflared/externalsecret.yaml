---
# Pulls the cloudflared tunnel credentials (credentials.json) from 1Password.
# In 1Password, the item "cloudflared" should have a field named "credentials"
# whose value is the tunnel credentials JSON, e.g.:
#   {"AccountTag":"...","TunnelID":"...","TunnelSecret":"..."}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-creds
  namespace: homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cloudflared-creds
    creationPolicy: Owner
  data:
    - secretKey: credentials.json
      remoteRef:
        key: cloudflared
        property: credentials
