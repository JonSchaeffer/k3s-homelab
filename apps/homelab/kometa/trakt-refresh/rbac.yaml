---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kometa-trakt-refresher
  namespace: homelab
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kometa-trakt-token"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kometa-trakt-refresher
  namespace: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kometa-trakt-refresher
subjects:
  - kind: ServiceAccount
    name: kometa-trakt-refresher
    namespace: homelab
