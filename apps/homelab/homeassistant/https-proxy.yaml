---
# nginx reverse proxy that terminates HTTPS for ha.jonschaeffer.dev on the
# node's :8443 and proxies (with WebSocket support) to HA's HTTP :8123.
# HA itself stays plain HTTP so Tailscale/LAN access is unaffected.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ha-https-nginx
  namespace: homelab
data:
  nginx.conf: |
    events {}

    http {
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen 8443 ssl;
            server_name ha.jonschaeffer.dev;

            ssl_certificate     /etc/nginx/certs/tls.crt;
            ssl_certificate_key /etc/nginx/certs/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;

            location / {
                proxy_pass http://homeassistant:8123;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                proxy_buffering off;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-https-nginx
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ha-https-nginx
  template:
    metadata:
      labels:
        app: ha-https-nginx
    spec:
      hostNetwork: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-1
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: cert
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: ha-https-nginx
        - name: cert
          secret:
            secretName: ha-tls
