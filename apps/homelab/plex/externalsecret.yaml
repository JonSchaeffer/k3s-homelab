---
# Plex API token for the guide-refresh CronJob.
# In 1Password: item "plex", field "token" = your PlexOnlineToken value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plex-token
  namespace: homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: plex-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: plex
        property: token