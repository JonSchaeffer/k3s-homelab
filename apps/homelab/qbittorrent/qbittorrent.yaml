---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent
  namespace: homelab
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      qbittorrent:
        initContainers:
          ensure-config:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.3@sha256:4fcf15b7f265c2c8d7bc2a7e13240a07e0593c326f3cf3b5b9bb69eec5b79299
            command:
              - python3
              - -c
            args:
              - |
                import pathlib, re, shutil
                p = pathlib.Path("/config/qBittorrent/qBittorrent.conf")
                defaults = pathlib.Path("/defaults/qBittorrent.conf")
                p.parent.mkdir(parents=True, exist_ok=True)
                if not p.exists() and defaults.exists():
                    shutil.copyfile(defaults, p)
                s = p.read_text() if p.exists() else ""
                if "[BitTorrent]" not in s:
                    s = s.rstrip() + "\n\n[BitTorrent]\n"
                for key, val in [("Session\\Interface", "tun0"), ("Session\\InterfaceName", "tun0")]:
                    if not re.search(r"(?m)^" + re.escape(key) + r"=", s):
                        lines = s.splitlines()
                        ins = next((i for i, l in enumerate(lines) if l.strip() == "[BitTorrent]"), len(lines))
                        lines.insert(ins + 1, key + "=" + val)
                        s = "\n".join(lines) + "\n"
                p.write_text(s)
                print("ensured VPN interface binding")
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.3@sha256:4fcf15b7f265c2c8d7bc2a7e13240a07e0593c326f3cf3b5b9bb69eec5b79299
            env:
              TZ: America/New_York
              QBT_WEBUI_PORT: &port 80
              QBT_TORRENTING_PORT: &torrentPort 50413
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 250Mi
              limits:
                memory: 2Gi
          gluetun:
            env:
              VPN_SERVICE_PROVIDER: custom
              VPN_TYPE: wireguard
              FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16,10.43.0.0/16,192.168.0.0/16
            envFrom:
              - secretRef:
                  name: qbittorrent-vpn-secret
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
              privileged: true
              allowPrivilegeEscalation: true
              runAsUser: 0 # Run as root to ensure proper permissions
              runAsGroup: 0
              runAsNonRoot: false
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            primary: true
            port: *port
          bittorrent:
            enabled: true
            port: *torrentPort
            protocol: TCP
    ingress:
      app:
        enabled: true
        className: tailscale
        defaultBackend:
          service:
            name: *app
            port:
              number: *port
        tls:
          - hosts:
            - *app
    # Note: If downloading very large torrents it might be worth using NFS for your download directory.
    # Beware if you are downloading torrents directly to a ZFS dataset that dataset will accrue fragmentation.
    persistence:
      config:
        enabled: true
        existingClaim: qbittorrent-config
      media:
        enabled: true
        type: custom
        volumeSpec:
          nfs:
            server: "192.168.0.147"
            path: /mnt/md0/media/downloads
        globalMounts:
          - path: /downloads
            subPath: torrents
      tmp:
        type: emptyDir
      incomplete:
        enabled: true
        type: emptyDir
