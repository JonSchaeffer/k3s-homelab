---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin
  namespace: homelab
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      jellyfin:
        containers:
          app:
            image:
              repository: jellyfin/jellyfin
              tag: 12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037
            env:
              TZ: America/New_York
              JELLYFIN_PublishedServerUrl: https://jellyfin.porgy-monitor.ts.net
              JELLYFIN_DataDir: /config
              JELLYFIN_ConfigDir: /config/config
              JELLYFIN_LogDir: /config/log
              JELLYFIN_CacheDir: /cache
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                gpu.intel.com/i915: 1
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # Skylake iGPU (PCI device 1912) only. k3s-1 is Haswell (0412) and its
                  # iHD driver does not initialise, so HEVC transcoding fails there.
                  # Every node advertises a single gpu.intel.com/i915 slot and Plex already
                  # holds k3s-2's, so this resolves to k3s-3 without a hard node pin.
                  - key: gpu.intel.com/device-id.0300-1912.present
                    operator: In
                    values: ["true"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        # 993 owns /dev/dri/renderD128 on the hosts; without it VAAPI/QSV fails.
        supplementalGroups: [44, 993, 10000]
        seccompProfile: { type: RuntimeDefault }
    persistence:
      config:
        existingClaim: jellyfin-config
        globalMounts:
          - path: /config
      cache:
        existingClaim: jellyfin-cache
        globalMounts:
          - path: /cache
      media:
        type: nfs
        server: 192.168.0.147
        path: /mnt/md0/media
        globalMounts:
          # Read-only for the trial. Flip to false only when you want Jellyfin to be
          # able to delete media or write artwork/.nfo into the library.
          - path: /media
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        controller: jellyfin
        type: LoadBalancer
        ports:
          http:
            port: *port
            nodePort: *port
    ingress:
      app:
        enabled: true
        className: tailscale
        annotations:
          tailscale.com/funnel: "true"
        defaultBackend:
          service:
            name: *app
            port:
              number: *port
        tls:
          - hosts:
              - *app
