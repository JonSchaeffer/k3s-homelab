---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app herdr
  namespace: homelab
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      herdr:
        containers:
          app:
            image:
              repository: ghcr.io/can1357/omp
              tag: latest
            command: ["/bin/sh", "/scripts/start.sh"]
            env:
              TZ: America/New_York
              HOME: /data
              TS_AUTHKEY:
                valueFrom:
                  secretKeyRef:
                    name: herdr-secrets
                    key: TS_AUTHKEY
                    optional: true
              GITHUB_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: herdr-secrets
                    key: GITHUB_TOKEN
                    optional: true
              GH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: herdr-secrets
                    key: GITHUB_TOKEN
                    optional: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: herdr-data
        globalMounts:
          - path: /data
      scripts:
        type: configMap
        name: herdr-scripts
        globalMounts:
          - path: /scripts/start.sh
            subPath: start.sh
            readOnly: true
    # No Service or Ingress: this node is reached over the tailnet, not HTTP.
