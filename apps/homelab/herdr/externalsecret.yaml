---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: herdr-secrets
  namespace: homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: herdr-secrets
    creationPolicy: Owner
  data:
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: herdr-tailscale-authkey
        property: password
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: herdr-github-token
        property: password
