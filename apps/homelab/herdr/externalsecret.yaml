---
# GHCR pull secret and the GitHub token used by gh/git in the pod.
# Both come from the existing "hermes" 1Password item, which has a classic
# GITHUB_TOKEN with repo + workflow scopes (also accepted by ghcr.io).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: herdr-github
  namespace: homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: herdr-github
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: hermes
        property: GITHUB_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"JonSchaeffer","password":"{{ .token }}","auth":"{{ printf "JonSchaeffer:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: hermes
        property: GITHUB_TOKEN
