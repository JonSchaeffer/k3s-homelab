---
# Pulls the Cloudflare API token (used by cert-manager DNS-01) from 1Password.
# 1Password item "cloudflare", field "api-token". The token needs Zone:DNS:Edit
# + Zone:Zone:Read on the jonschaeffer.dev zone.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare
        property: api-token
