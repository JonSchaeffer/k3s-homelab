apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1m
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: Revision
      # Pinned: chart 1.13.0 declares kubeVersion ">=1.34.0-0", which is incompatible with
      # this cluster (v1.30.2+k3s2) and makes every Helm upgrade fail. 1.12.1 is the last
      # release supporting >=1.25.0-0. Bump only alongside a k3s upgrade.
      version: "1.13.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 1m
  values:
    defaultBackupStore:
      backupTarget: "s3://k3s-homelab-longhorn-backup@us/"
      backupTargetCredentialSecret: "longhorn-gcp-backup-creds"
      pollInterval: "180"
